name: PR Template Selector

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  select-template:
    name: Apply PR Template by Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update PR Description
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const branchName = context.payload.pull_request.head.ref;
            let templatePath = '.github/PULL_REQUEST_TEMPLATE/default.md';

            // Match branch prefix
            if (branchName.startsWith('feat/') || branchName.startsWith('feature/')) {
              templatePath = '.github/PULL_REQUEST_TEMPLATE/feature.md';
            } else if (branchName.startsWith('fix/') || branchName.startsWith('bugfix/')) {
              templatePath = '.github/PULL_REQUEST_TEMPLATE/bugfix.md';
            } else if (branchName.startsWith('docs/')) {
              templatePath = '.github/PULL_REQUEST_TEMPLATE/docs.md';
            }

            if (fs.existsSync(templatePath)) {
              let templateContent = fs.readFileSync(templatePath, 'utf8');
              const currentBody = context.payload.pull_request.body || '';

              // Only overwrite if the current description is empty or placeholder
              if (currentBody.trim() === '' || currentBody.trim() === 'No description provided.') {
                const apiKey = process.env.GEMINI_API_KEY;
                
                if (apiKey) {
                  console.log('GEMINI_API_KEY found. Fetching PR diff to auto-fill template...');
                  try {
                    const { data: diffContent } = await github.rest.pulls.get({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.payload.pull_request.number,
                      headers: {
                        accept: 'application/vnd.github.v3.diff'
                      }
                    });

                    console.log('Sending diff to Gemini API...');
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                        contents: [{
                          parts: [{
                            text: `Você é um desenvolvedor especialista. Preencha o seguinte template de Pull Request em markdown com base no diff do git fornecido abaixo.
            O idioma das respostas deve ser em português do Brasil (assim como o template).

            Template para preencher:
            ${templateContent}

            Diff do Git:
            ${diffContent.slice(0, 40000)}

            Regras:
            1. Retorne APENAS o markdown preenchido.
            2. Não adicione outros comentários adicionais, introduções ou blocos de código com crases triplas (tags markdown de código) envolvendo o resultado final. O seu output deve começar diretamente com o cabeçalho do template.
            3. Analise o diff e preencha as descrições de forma precisa e técnica.
            4. No checklist do template, marque [x] somente se a modificação correspondente for evidente no diff (ex: se houver testes novos ou build modificado).`
                          }]
                        }]
                      })
                    });

                    const result = await response.json();
                    const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (generatedText && generatedText.trim().length > 0) {
                      templateContent = generatedText.trim();
                      console.log('Successfully generated template description using Gemini.');
                    } else {
                      console.log('Gemini returned an empty response. Falling back to blank template.');
                    }
                  } catch (err) {
                    console.error('Error calling Gemini or fetching diff:', err);
                    console.log('Falling back to blank template.');
                  }
                } else {
                  console.log('GEMINI_API_KEY not set. Using blank template.');
                }

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  body: templateContent
                });
                console.log(`Successfully applied template to PR #${context.payload.pull_request.number}`);
              } else {
                console.log('PR description already exists. Skipping template overwrite.');
              }
            } else {
              console.log(`Template file not found at ${templatePath}`);
            }
